upstream pearson_dashboard_local {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001 backup;
}

server {
    listen 443 ssl;
    server_name id.mypte.pearsonpte.com mypte.pearsonpte.com;

    ssl_certificate /etc/nginx/ssl/mypte-local.crt;
    ssl_certificate_key /etc/nginx/ssl/mypte-local.key;

    location / {
        proxy_pass http://pearson_dashboard_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name id.mypte.pearsonpte.com mypte.pearsonpte.com;
    return 301 https://$host$request_uri;
}
