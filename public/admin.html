<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | myPTE</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/cdn.pearsonpte.com/assets/fonts/plus-jakarta-sans/plus-jakarta-sans.css">
  <style>
    :root {
      --purple: #5c2d91;
      --teal: #007fa3;
      --yellow: #ffb81c;
      --ink: #202020;
      --line: #d8d8d8;
      --soft: #f7f7f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--soft);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      margin: 0;
    }

    header {
      align-items: center;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      padding: 18px 32px;
    }

    .brand {
      color: var(--purple);
      font-size: 24px;
      font-weight: 700;
    }

    main {
      margin: 0 auto;
      max-width: 1080px;
      padding: 32px;
    }

    h1 {
      color: var(--purple);
      font-size: 30px;
      margin: 0 0 24px;
    }

    .layout {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(280px, 360px) 1fr;
    }

    section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    input,
    select {
      border: 1px solid #a7a7a7;
      border-radius: 4px;
      font: inherit;
      height: 44px;
      margin-bottom: 14px;
      padding: 0 12px;
      width: 100%;
    }

    button {
      background: var(--purple);
      border: 0;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      padding: 0 18px;
    }

    .secondary {
      background: var(--teal);
    }

    .message {
      margin-top: 14px;
      min-height: 22px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 12px 8px;
      text-align: left;
    }

    th {
      color: var(--purple);
      font-size: 13px;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      header,
      main {
        padding-left: 18px;
        padding-right: 18px;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">myPTE Admin</div>
    <button class="secondary" id="logoutButton" type="button">Log out</button>
  </header>

  <main>
    <h1>Users</h1>
    <div class="layout">
      <section>
        <h2>Create user</h2>
        <form id="userForm">
          <input id="userId" name="id" type="hidden">

          <label for="pteId">PTE ID</label>
          <input id="pteId" name="pteId">

          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" required>

          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" required>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>

          <label for="username">Username</label>
          <input id="username" name="username" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>

          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
          </select>

          <label for="isActive">Active</label>
          <select id="isActive" name="isActive">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>

          <label for="birthDay">Birth day</label>
          <input id="birthDay" name="birthDay" type="number" min="1" max="31">

          <label for="birthMonth">Birth month</label>
          <input id="birthMonth" name="birthMonth" type="number" min="1" max="12">

          <label for="birthYear">Birth year</label>
          <input id="birthYear" name="birthYear" type="number" min="1900" max="2100">

          <label for="countryOfCitizenship">Country of citizenship</label>
          <input id="countryOfCitizenship" name="countryOfCitizenship">

          <label for="countryOfResidence">Country of residence</label>
          <input id="countryOfResidence" name="countryOfResidence">

          <label for="gender">Gender</label>
          <input id="gender" name="gender">

          <label for="avatarUpload">User image</label>
          <input id="avatarUpload" accept="image/*" type="file">
          <input id="avatarUrl" name="avatarUrl" type="hidden">
          <img id="avatarPreview" alt="" style="display:none;width:96px;height:96px;object-fit:cover;border-radius:50%;margin:0 0 14px;">

          <button id="saveUserButton" type="submit">Create user</button>
          <button class="secondary" id="resetUserForm" type="button">New user</button>
          <div class="message" id="message"></div>
        </form>
      </section>

      <section>
        <h2>Existing users</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </section>

      <section>
        <h2>Create test</h2>
        <form id="testForm">
          <input id="testId" name="id" type="hidden">

          <label for="testUserId">User</label>
          <select id="testUserId" name="userId" required></select>

          <label for="testTitle">Title</label>
          <input id="testTitle" name="title" required>

          <label for="testScore">Score</label>
          <input id="testScore" name="score" type="number" step="0.1">

          <label for="testStatus">Status</label>
          <input id="testStatus" name="status">

          <label for="listeningScore">Listening score</label>
          <input id="listeningScore" name="listeningScore" type="number" min="0" max="90">

          <label for="readingScore">Reading score</label>
          <input id="readingScore" name="readingScore" type="number" min="0" max="90">

          <label for="speakingScore">Speaking score</label>
          <input id="speakingScore" name="speakingScore" type="number" min="0" max="90">

          <label for="writingScore">Writing score</label>
          <input id="writingScore" name="writingScore" type="number" min="0" max="90">

          <label for="testDate">Test date</label>
          <input id="testDate" name="testDate" type="date">

          <label for="testTime">Test time</label>
          <input id="testTime" name="testTime" placeholder="1:30 PM">

          <label for="registrationId">Registration ID</label>
          <input id="registrationId" name="registrationId">

          <label for="reportCode">Score report code</label>
          <input id="reportCode" name="reportCode">

          <label for="testCenterName">Test center</label>
          <input id="testCenterName" name="testCenterName">

          <label for="testCenterId">Test center ID</label>
          <input id="testCenterId" name="testCenterId">

          <label for="testCenterAddress1">Test center address 1</label>
          <input id="testCenterAddress1" name="testCenterAddress1">

          <label for="testCenterAddress2">Test center address 2</label>
          <input id="testCenterAddress2" name="testCenterAddress2">

          <label for="testCenterCity">Test center city</label>
          <input id="testCenterCity" name="testCenterCity">

          <label for="testCenterState">Test center state</label>
          <input id="testCenterState" name="testCenterState">

          <label for="testCenterCountry">Test center country</label>
          <input id="testCenterCountry" name="testCenterCountry">

          <label for="testCenterPostalCode">Test center postal code</label>
          <input id="testCenterPostalCode" name="testCenterPostalCode">

          <label for="timezone">Timezone</label>
          <input id="timezone" name="timezone">

          <label for="validUntil">Valid until</label>
          <input id="validUntil" name="validUntil" type="date">

          <label for="testDescription">Description</label>
          <textarea id="testDescription" name="description"></textarea>

          <button id="saveTestButton" type="submit">Save test</button>
          <button class="secondary" id="resetTestForm" type="button">New test</button>
          <div class="message" id="testsMessage"></div>
        </form>
      </section>

      <section>
        <h2>Saved tests</h2>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Title</th>
              <th>Score</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tests"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
